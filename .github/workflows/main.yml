name: ADF CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  id-token: write           # required for OIDC login to Azure
  contents: read

env:
  # ---- SOURCE (dev) factory: validate + export always run against this ----
  DEV_SUBSCRIPTION_ID: 7bfcce01-6970-4984-aa6a-d21aa8b40966
  DEV_RESOURCE_GROUP: rg_dev2026v1
  DEV_FACTORY_NAME: adfdev2026v1

jobs:
  build:
    name: Build ARM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install ADF Utilities package
        run: npm install
        working-directory: ${{ github.workspace }}/build

      - name: Validate all ADF resources
        run: >
          npm run build validate
          ${{ github.workspace }}/
          /subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_FACTORY_NAME }}
        working-directory: ${{ github.workspace }}/build

      - name: Generate ARM template
        run: >
          npm run build export
          ${{ github.workspace }}/
          /subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_FACTORY_NAME }}
          "ExportedArmTemplate"
        working-directory: ${{ github.workspace }}/build

      - name: Upload ARM template artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExportedArmTemplate
          path: ${{ github.workspace }}/build/ExportedArmTemplate

  release:
    name: Deploy to target factory
    needs: build
    runs-on: ubuntu-latest
    # environment: prod        # uncomment to require manual approval before deploying
    steps:
      - name: Download ARM template artifact
        uses: actions/download-artifact@v4
        with:
          name: ExportedArmTemplate
          path: ${{ github.workspace }}/adf-arm

      - name: Login via Az module
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Deploy to Data Factory
        uses: Azure/data-factory-deploy-action@v1.2.0
        with:
          resourceGroupName: ${{ vars.TARGET_RG }}
          dataFactoryName: ${{ vars.TARGET_ADF }}
          armTemplateFile: ${{ github.workspace }}/adf-arm/ARMTemplateForFactory.json
          armTemplateParametersFile: ${{ github.workspace }}/adf-arm/ARMTemplateParametersForFactory.json
          # additionalParameters: 'ls_adls_properties_typeProperties_url=https://<targetstorage>.dfs.core.windows.net/'
