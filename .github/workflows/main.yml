name: ADF CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  # DEV ADF
  DEV_SUBSCRIPTION_ID: 7bfccce01-6970-4984-aa6a-d21aa8b40966
  DEV_RESOURCE_GROUP: rg_dev2026v1
  DEV_DATA_FACTORY: adfdev2026v1

  # PROD ADF
  PROD_RESOURCE_GROUP: rg_prod2026v1
  PROD_DATA_FACTORY: addfprod2026v1

jobs:

  # ==========================================================
  # BUILD / VALIDATE / EXPORT
  # ==========================================================
  build:
    name: Validate and Export ADF
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # --------------------------------------------------------
      # Show repository structure
      # --------------------------------------------------------
      - name: Check repository structure
        run: |
          echo "Workspace:"
          echo "${{ github.workspace }}"

          echo ""
          echo "Top-level files:"
          ls -la "${{ github.workspace }}"

          echo ""
          echo "ADF directories:"
          find "${{ github.workspace }}" -maxdepth 2 -type d | sort

      # --------------------------------------------------------
      # Check ADF source files
      # --------------------------------------------------------
      - name: Check ADF resources
        run: |
          echo "Checking ADF resource folders..."

          for folder in \
            pipeline \
            dataset \
            linkedService \
            trigger \
            dataflow \
            integrationRuntime
          do
            if [ -d "${{ github.workspace }}/$folder" ]; then
              echo "FOUND: $folder"
            else
              echo "WARNING: $folder not found"
            fi
          done

          echo ""
          echo "ADF JSON files:"
          find "${{ github.workspace }}" \
            -type f \
            -name "*.json" \
            | sort \
            | head -200

      # --------------------------------------------------------
      # Install ADF Utilities
      # --------------------------------------------------------
      - name: Install ADF Utilities
        run: npm install
        working-directory: ${{ github.workspace }}/build

      # --------------------------------------------------------
      # Validate ADF
      # --------------------------------------------------------
      - name: Validate ADF
        run: |
          npm run build validate \
            "${{ github.workspace }}" \
            "/subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_DATA_FACTORY }}"
        working-directory: ${{ github.workspace }}/build

      # --------------------------------------------------------
      # Export ARM Template
      # --------------------------------------------------------
      - name: Export ARM Template
        run: |
          rm -rf "${{ github.workspace }}/build/ExportedArmTemplate"

          npm run build export \
            "${{ github.workspace }}" \
            "/subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_DATA_FACTORY }}" \
            "ExportedArmTemplate"
        working-directory: ${{ github.workspace }}/build

      # --------------------------------------------------------
      # Verify ARM template
      # --------------------------------------------------------
      - name: Verify ARM template
        run: |
          echo "Generated ARM files:"
          find "${{ github.workspace }}/build/ExportedArmTemplate" \
            -type f \
            -print

          if [ ! -f "${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateForFactory.json" ]; then
            echo "ERROR: ARMTemplateForFactory.json was not generated."
            exit 1
          fi

          if [ ! -f "${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateParametersForFactory.json" ]; then
            echo "ERROR: ARMTemplateParametersForFactory.json was not generated."
            exit 1
          fi

          echo "ARM template validation successful."

      # --------------------------------------------------------
      # Upload ARM template
      # --------------------------------------------------------
      - name: Upload ARM template
        uses: actions/upload-artifact@v4
        with:
          name: ExportedArmTemplate
          path: ${{ github.workspace }}/build/ExportedArmTemplate
          if-no-files-found: error


  # ==========================================================
  # RELEASE / DEPLOY TO PROD
  # ==========================================================
  release:
    name: Deploy ADF to Production
    needs: build
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download ARM template
      # --------------------------------------------------------
      - name: Download ARM template
        uses: actions/download-artifact@v4
        with:
          name: ExportedArmTemplate
          path: ${{ github.workspace }}/ExportedArmTemplate

      # --------------------------------------------------------
      # Check downloaded files
      # --------------------------------------------------------
      - name: Check downloaded ARM template
        run: |
          echo "Downloaded files:"
          find "${{ github.workspace }}/ExportedArmTemplate" \
            -type f \
            -print

          if [ ! -f "${{ github.workspace }}/ExportedArmTemplate/ARMTemplateForFactory.json" ]; then
            echo "ERROR: ARMTemplateForFactory.json not found."
            exit 1
          fi

          if [ ! -f "${{ github.workspace }}/ExportedArmTemplate/ARMTemplateParametersForFactory.json" ]; then
            echo "ERROR: ARMTemplateParametersForFactory.json not found."
            exit 1
          fi

      # --------------------------------------------------------
      # Login to Azure using OIDC
      # --------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Deploy to PROD ADF
      # --------------------------------------------------------
      - name: Deploy ADF to Production
        uses: Azure/data-factory-deploy-action@v1.2.0
        with:
          resourceGroupName: ${{ env.PROD_RESOURCE_GROUP }}
          dataFactoryName: ${{ env.PROD_DATA_FACTORY }}
          armTemplateFile: ${{ github.workspace }}/ExportedArmTemplate/ARMTemplateForFactory.json
          armTemplateParametersFile: ${{ github.workspace }}/ExportedArmTemplate/ARMTemplateParametersForFactory.json

      # --------------------------------------------------------
      # Deployment completed
      # --------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "ADF deployment completed successfully"
          echo "=========================================="
          echo "Production Resource Group:"
          echo "${{ env.PROD_RESOURCE_GROUP }}"
          echo ""
          echo "Production Data Factory:"
          echo "${{ env.PROD_DATA_FACTORY }}"
