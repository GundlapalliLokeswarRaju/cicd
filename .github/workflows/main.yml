name: ADF CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  DEV_RESOURCE_GROUP: rg_dev2026v1
  DEV_DATA_FACTORY: adfdev2026v1
  DEV_SUBSCRIPTION_ID: 7bfcce01-6970-4984-aa6a-d21aa8b40966

  PROD_RESOURCE_GROUP: rg_prod2026v1
  PROD_DATA_FACTORY: addfprod2026v1

jobs:

  # ============================================================
  # BUILD / VALIDATE / EXPORT
  # ============================================================
  build:
    name: Validate and Export ADF
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Install Node.js
      # ADF Utilities currently recommends Node 20.x or 22.x
      # ----------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: build/package-lock.json

      # ----------------------------------------------------------
      # Debug repository structure
      # This helps verify that pipeline/, dataset/, etc.
      # actually exist in the checked-out repository.
      # ----------------------------------------------------------
      - name: Debug repository structure
        run: |
          echo "======================================"
          echo "GitHub Workspace"
          echo "======================================"
          echo "${{ github.workspace }}"

          echo ""
          echo "======================================"
          echo "Top-level files/directories"
          echo "======================================"
          ls -la "${{ github.workspace }}"

          echo ""
          echo "======================================"
          echo "Repository directories"
          echo "======================================"
          find "${{ github.workspace }}" -maxdepth 3 -type d | sort

          echo ""
          echo "======================================"
          echo "ADF JSON files"
          echo "======================================"
          find "${{ github.workspace }}" \
            -type f \
            -name "*.json" \
            | sort \
            | head -300

      # ----------------------------------------------------------
      # Verify expected ADF directories
      # ----------------------------------------------------------
      - name: Verify ADF source folders
        run: |
          echo "Checking ADF source folders..."

          required_dirs=(
            "pipeline"
            "dataset"
            "linkedService"
            "trigger"
            "dataflow"
            "integrationRuntime"
          )

          missing=0

          for dir in "${required_dirs[@]}"; do
            if [ -d "${{ github.workspace }}/$dir" ]; then
              echo "FOUND: $dir"
            else
              echo "NOT FOUND: $dir"
              missing=$((missing + 1))
            fi
          done

          echo ""
          echo "Missing directories: $missing"

          if [ "$missing" -eq 6 ]; then
            echo "ERROR: No ADF resource directories were found."
            echo "The ADF root folder is probably not the repository root."
            exit 1
          fi

      # ----------------------------------------------------------
      # Install ADF Utilities
      # package.json is located in /build
      # ----------------------------------------------------------
      - name: Install ADF Utilities
        run: npm ci
        working-directory: ${{ github.workspace }}/build

      # ----------------------------------------------------------
      # Validate ADF
      #
      # Root folder:
      #   ${{ github.workspace }}
      #
      # DEV ADF resource ID:
      #   /subscriptions/.../resourceGroups/.../providers/
      #   Microsoft.DataFactory/factories/...
      # ----------------------------------------------------------
      - name: Validate ADF
        run: |
          npm run build validate \
            "${{ github.workspace }}" \
            "/subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_DATA_FACTORY }}"
        working-directory: ${{ github.workspace }}/build

      # ----------------------------------------------------------
      # Export ARM Template
      # ----------------------------------------------------------
      - name: Export ARM Template
        run: |
          rm -rf "${{ github.workspace }}/build/ExportedArmTemplate"

          npm run build export \
            "${{ github.workspace }}" \
            "/subscriptions/${{ env.DEV_SUBSCRIPTION_ID }}/resourceGroups/${{ env.DEV_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_DATA_FACTORY }}" \
            "ExportedArmTemplate"
        working-directory: ${{ github.workspace }}/build

      # ----------------------------------------------------------
      # Verify generated ARM templates
      # ----------------------------------------------------------
      - name: Verify exported ARM template
        run: |
          echo "======================================"
          echo "Exported ARM template files"
          echo "======================================"

          find "${{ github.workspace }}/build/ExportedArmTemplate" \
            -type f \
            -maxdepth 3 \
            -print

          echo ""
          echo "======================================"
          echo "Checking required ARM files"
          echo "======================================"

          if [ ! -f "${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateForFactory.json" ]; then
            echo "ERROR: ARMTemplateForFactory.json was not generated."
            exit 1
          fi

          if [ ! -f "${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateParametersForFactory.json" ]; then
            echo "ERROR: ARMTemplateParametersForFactory.json was not generated."
            exit 1
          fi

          echo "ARMTemplateForFactory.json FOUND"
          echo "ARMTemplateParametersForFactory.json FOUND"

      # ----------------------------------------------------------
      # Upload generated ARM template
      # ----------------------------------------------------------
      - name: Upload ARM template artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExportedArmTemplate
          path: |
            ${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateForFactory.json
            ${{ github.workspace }}/build/ExportedArmTemplate/ARMTemplateParametersForFactory.json
          if-no-files-found: error


  # ============================================================
  # RELEASE / DEPLOY TO PROD
  # ============================================================
  release:
    name: Deploy ADF to Production
    needs: build
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Download ARM template artifact
      # ----------------------------------------------------------
      - name: Download ARM template artifact
        uses: actions/download-artifact@v4
        with:
          name: ExportedArmTemplate
          path: ${{ github.workspace }}/ExportedArmTemplate

      # ----------------------------------------------------------
      # Verify downloaded files
      # ----------------------------------------------------------
      - name: Verify downloaded ARM template
        run: |
          echo "======================================"
          echo "Downloaded artifact"
          echo "======================================"

          find "${{ github.workspace }}/ExportedArmTemplate" \
            -type f \
            -print

          echo ""
          echo "Checking required files..."

          if [ ! -f "${{ github.workspace }}/ExportedArmTemplate/ARMTemplateForFactory.json" ]; then
            echo "ERROR: ARMTemplateForFactory.json not found."
            exit 1
          fi

          if [ ! -f "${{ github.workspace }}/ExportedArmTemplate/ARMTemplateParametersForFactory.json" ]; then
            echo "ERROR: ARMTemplateParametersForFactory.json not found."
            exit 1
          fi

          echo "ARM template files found."

      # ----------------------------------------------------------
      # Login to Azure using GitHub OIDC
      #
      # Secrets required:
      #
      # AZURE_CLIENT_ID
      # AZURE_TENANT_ID
      # AZURE_SUBSCRIPTION_ID
      #
      # AZURE_CLIENT_ID = Client ID of your User Assigned
      #                   Managed Identity / Service Principal
      #
      # AZURE_TENANT_ID = Microsoft Entra Tenant ID
      #
      # AZURE_SUBSCRIPTION_ID = Azure subscription ID
      # ----------------------------------------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ----------------------------------------------------------
      # Deploy ARM template to Production ADF
      # ----------------------------------------------------------
      - name: Deploy ADF to Production
        uses: Azure/data-factory-deploy-action@v1.2.0
        with:
          resourceGroupName: ${{ env.PROD_RESOURCE_GROUP }}
          dataFactoryName: ${{ env.PROD_DATA_FACTORY }}
          armTemplateFile: ${{ github.workspace }}/ExportedArmTemplate/ARMTemplateForFactory.json
          armTemplateParametersFile: ${{ github.workspace }}/ExportedArmTemplate/ARMTemplateParametersForFactory.json

      # ----------------------------------------------------------
      # Deployment complete
      # ----------------------------------------------------------
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "ADF deployment completed successfully"
          echo "======================================"
          echo "Resource Group : ${{ env.PROD_RESOURCE_GROUP }}"
          echo "Data Factory   : ${{ env.PROD_DATA_FACTORY }}"
